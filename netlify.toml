[build]
  command = "python3 scripts/build-player-guide.py && node scripts/build-guide-site.mjs && node scripts/build-prelaunch.mjs && node scripts/polish-player-guide.mjs && python3 scripts/build-public-guide.py && python3 scripts/build-reward-first.py && node scripts/build-season-status.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Isolated settlement review; the default production build stays above.
[context."feature/settlement-app-integration-20261020"]
  command = "node settlement-integration/build-review.mjs"
  environment = { NODE_VERSION = "24" }
