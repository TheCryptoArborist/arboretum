name: Preserve production dependencies without changing main
on:
  push:
    branches: [recovery/production-garden-20260909]
    paths: [.github/workflows/production-dependencies.yml]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_BRANCH: recovery/production-garden-20260909
    steps:
      - name: Verify live dependencies and preserve exact bytes on recovery branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, datetime, difflib, hashlib, json, os, re, subprocess, tempfile, pathlib
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urlsplit
          repo = 'TheCryptoArborist/arboretum'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          branch = os.environ['RECOVERY_BRANCH']
          assert branch == 'recovery/production-garden-20260909'
          baseline = 'd493a045dddf9d4111e0c8ba92ae3a9ba6fc665b'
          origin = 'https://6aa0cfff32d753e6369d8cba--arboretum-sui-forest.netlify.app/'
          def api(path, data=None, method=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Arboretum-production-recovery'}
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              with urlopen(Request('https://api.github.com/repos/' + repo + path, data=body, headers=headers, method=method or ('GET' if data is None else 'POST')), timeout=45) as response:
                  return json.load(response)
          def get(url):
              assert urlsplit(url).netloc in {urlsplit(origin).netloc, 'treegrow.xyz'}
              with urlopen(Request(url, headers={'Accept-Encoding': 'identity', 'Cache-Control': 'no-cache', 'User-Agent': 'Arboretum-source-backup/1.0'}), timeout=45) as response:
                  assert response.status == 200
                  assert urlsplit(response.url).netloc in {urlsplit(origin).netloc, 'treegrow.xyz'}
                  data = response.read(8000001)
                  assert len(data) <= 8000000
                  return data
          def git_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def blob(data):
              obj = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert obj['sha'] == git_hash(data)
              return obj['sha']
          def read(path, ref):
              obj = api('/contents/' + path + '?ref=' + quote(ref, safe=''))
              data = base64.b64decode(obj['content'])
              assert obj['sha'] == git_hash(data)
              return data
          assert api('/git/ref/heads/main')['object']['sha'] == baseline, 'Main advanced; do not overwrite'
          page = get(origin + 'index.html')
          assert page == get('https://treegrow.xyz/'), 'Production changed during recovery'
          assert git_hash(page) == '7757bfb2695c822d20752ded16eb0048f753bcd7'
          expected = {
              'wallet.js': 'de725c9fe0db18d35e41232f7ad96406de086168',
              'assets/shop/crates/boom-chest.png': 'd90ebb332a84efe2b4b6ca32881a2b9c259dd8c5',
              'assets/shop/crates/victory-chest.png': 'c067051cf16e237c2e8c0a8c6c46224ffee4561c'
          }
          saved = {'index.html': git_hash(page)}
          report = {'created_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'baseline_commit': baseline, 'production_index_blob': git_hash(page), 'dependencies': [], 'main_modified': False}
          for path, sha in expected.items():
              data = get(origin + path)
              assert data == get('https://treegrow.xyz/' + path), path + ' differs between pinned and current production'
              assert git_hash(data) == sha, path + ' changed since inspection'
              entry = {'path': path, 'bytes': len(data), 'blob_sha': sha, 'sha256': hashlib.sha256(data).hexdigest(), 'production_matches_pinned': True}
              if path.endswith('.js'):
                  old = read(path, baseline)
                  difference = ''.join(difflib.unified_diff(old.decode().splitlines(True), data.decode().splitlines(True), fromfile='github-main/' + path, tofile='production/' + path))
                  saved['recovery/production-wallet.diff'] = blob(difference.encode())
                  saved['recovery/prior-wallet.js'] = git_hash(old)
                  with tempfile.TemporaryDirectory() as tmp:
                      file = pathlib.Path(tmp) / 'wallet.mjs'
                      file.write_bytes(data)
                      check = subprocess.run(['node', '--check', str(file)], capture_output=True, text=True, timeout=20)
                      assert check.returncode == 0, check.stderr
                      entry['javascript_syntax_pass'] = True
                  entry['added_lines'] = sum(s.startswith('+') and not s.startswith('+++') for s in difference.splitlines())
                  entry['removed_lines'] = sum(s.startswith('-') and not s.startswith('---') for s in difference.splitlines())
              else:
                  assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Expected PNG bytes'
              saved[path] = blob(data)
              report['dependencies'].append(entry)
          old_page = read('index.html', baseline).decode()
          text = page.decode()
          report['reference_context'] = []
          for path in ['assets/cosmetics/frames/crystal-trellis.png', 'assets/cosmetics/frames/rare-crystal-bark.png', 'assets/nftree-wallet-mint.js']:
              entry = {'path': path, 'present_in_prior_main': path in old_page, 'production_context': []}
              for match in re.finditer(re.escape(path), text):
                  entry['production_context'].append(text[max(0, match.start()-230):match.end()+280])
              report['reference_context'].append(entry)
          report['saved_production_files'] = {k: v for k, v in saved.items() if not k.startswith('recovery/')}
          saved['recovery/dependency-report.json'] = blob((json.dumps(report, indent=2) + '\n').encode())
          parent = api('/git/ref/heads/' + branch)['object']['sha']
          assert parent == os.environ['GITHUB_SHA'], 'Recovery branch changed'
          old_tree = api('/git/commits/' + parent)['tree']['sha']
          new_tree = api('/git/trees', {'base_tree': old_tree, 'tree': [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha} for path, sha in saved.items()]})['sha']
          commit = api('/git/commits', {'message': 'Preserve production HTML and required runtime dependencies [skip netlify]', 'tree': new_tree, 'parents': [parent]})['sha']
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          assert api('/git/ref/heads/main')['object']['sha'] == baseline
          print(json.dumps({'backup_commit': commit, 'production_files': report['saved_production_files'], 'main_unchanged': True}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Preserved dependencies\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
