name: Verify published player guide
on:
  push:
    branches: [publish/player-guide-20260912]
    paths: [.github/workflows/verify-guide-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12f2d489ad2fff80c65ad13869baadcb8b36d21b
          persist-credentials: false
      - name: Verify the public guide, normalized navigation and unchanged runtime
        run: |
          python3 scripts/build-player-guide.py
          node scripts/build-guide-site.mjs
          python3 - <<'PY'
          import json,hashlib,re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request,urlopen
          out=Path('live-verification');out.mkdir()
          class Normalize(HTMLParser):
              def __init__(self):super().__init__(convert_charrefs=True);self.events=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href','').startswith('player-guide.html'):
                      a['href']='/player-guide'+a['href'][len('player-guide.html'):]
                  self.events.append(('start',tag,sorted(a.items())))
              def handle_startendtag(self,tag,attrs):self.handle_starttag(tag,attrs);self.handle_endtag(tag)
              def handle_endtag(self,tag):self.events.append(('end',tag))
              def handle_data(self,data):self.events.append(('data',data))
              def handle_comment(self,data):self.events.append(('comment',data))
              def handle_decl(self,data):self.events.append(('decl',data))
          def events(data):
              p=Normalize();p.feed(data.decode());return p.events
          def get(p):
              req=Request('https://treegrow.xyz/'+p,headers={'User-Agent':'Arboretum-guide-verification','Cache-Control':'no-cache'})
              with urlopen(req,timeout=30) as r:return r.read(),r.status,r.url
          report={}
          for p in ['player-guide.html','player-guide','index.html','wallet.js','garden.js','sui-sdk.bundle.js']:
              data,status,url=get(p)
              expected=(Path('dist')/('player-guide.html' if p=='player-guide' else p)).read_bytes()
              (out/p).write_bytes(data)
              info={'http_status':status,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'exact_match':data==expected}
              if p=='index.html':
                  info['same_document_except_pretty_guide_links']=events(data)==events(expected)
                  old=re.findall(r'<script\b[^>]*>[\s\S]*?</script\s*>',expected.decode(),re.I)
                  new=re.findall(r'<script\b[^>]*>[\s\S]*?</script\s*>',data.decode(),re.I)
                  info['all_inline_scripts_identical']=old==new
                  parsed=Normalize();parsed.feed(data.decode())
                  links=[dict(ev[2]).get('href','') for ev in parsed.events if ev[0]=='start' and ev[1]=='a']
                  info['five_guide_links_present']=sum(x.startswith('/player-guide') for x in links)==5
              report[p]=info
          guide=(out/'player-guide.html').read_text()
          report['guide_content']={'purchase_order':'What do I buy first?' in guide,'tools':guide.count('class="tool"'),'tester_label':'TESTER PREVIEW' in guide}
          report['validation_note']='Initial byte-only index comparison failed because Netlify normalizes the five new guide links to /player-guide and reorders anchor attributes. Full parsed-document comparison now permits only that known href normalization; original game scripts remain identical.'
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert all(report[p]['exact_match'] for p in ['player-guide.html','player-guide','wallet.js','garden.js','sui-sdk.bundle.js'])
          assert report['index.html']['same_document_except_pretty_guide_links']
          assert report['index.html']['all_inline_scripts_identical'] and report['index.html']['five_guide_links_present']
          assert report['guide_content']['purchase_order'] and report['guide_content']['tools']==20
          print('VERIFIED_SHARE_LINK=https://treegrow.xyz/player-guide')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-guide-live-check
          path: live-verification/
          retention-days: 14
