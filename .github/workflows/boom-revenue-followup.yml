name: Verify BOOM revenue routing
on:
  push:
    branches: [analysis/boom-receipts-20260912]
    paths: [.github/workflows/boom-revenue-followup.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read recent public crate receipts only
        run: |
          python3 -u - <<'PY'
          import json,datetime
          from pathlib import Path
          from urllib.request import Request,urlopen
          OUT=Path('boom-followup');OUT.mkdir()
          fields='''digest sender { address } transactionBcs effects { status timestamp checkpoint { sequenceNumber } effectsJson balanceChanges(first:50){pageInfo{hasNextPage endCursor} nodes{amount coinType{repr} owner{address asObject{address}}}} events(first:50){pageInfo{hasNextPage endCursor} nodes{sequenceNumber contents{type{repr} json}}} }'''
          q='query($f:TransactionFilter!){transactions(last:30,filter:$f){pageInfo{hasPreviousPage startCursor} nodes{'+fields+'}}}'
          payload={'query':q,'variables':{'f':{'function':'0x2181ed994caf30b30878d16a7309c79fa36b3a25e35b3a973cd2c9a6bc615d9a::lootbox::open_box'}}}
          request=Request('https://graphql.mainnet.sui.io/graphql',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','User-Agent':'BOOM-public-receipt-audit'})
          with urlopen(request,timeout=30) as response:data=json.load(response)
          (OUT/'recent-box-purchases.json').write_text(json.dumps(data,indent=2))
          assert not data.get('errors'),str(data.get('errors'))
          print('Read',len(data['data']['transactions']['nodes']),'recent crate transactions; no transactions signed.')
          (OUT/'coverage.json').write_text(json.dumps({'read_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Last 30 transactions calling BOOM open_box; not all platform activity.'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boom-box-route-examples
          path: boom-followup/
          retention-days: 3
