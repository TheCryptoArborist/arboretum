name: Season 4 preparation
on:
  push:
    branches: [feature/season-four-owner-test-20261117]
    paths: ['.github/workflows/season-four-preparation.yml', 'settlement-cycle-four/**', 'settlement-cycle-next/**']
permissions:
  contents: read
concurrency:
  group: season-four-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Preserve exact tracked source for review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p season-four-results
          git rev-parse HEAD > season-four-results/source-sha.txt
          git archive --format=tar HEAD | gzip > season-four-results/source.tar.gz
      - name: Install existing locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify unchanged Season 3 baseline
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-isolation=none settlement-cycle-three/*.test.mjs | tee season-four-results/season-three-tests.txt
      - name: Capture public mainnet state with read-only queries
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { parse } from 'graphql';
          import { EXPECTED, PROOF_QUERY, PROOF_VARIABLES, INPUTS_QUERY, INPUT_VARIABLES, inspectState, contents } from './settlement-cycle-three/common.mjs';
          const save = (name, value) => fs.writeFileSync('season-four-results/' + name + '.json', JSON.stringify(value, (_, v) => typeof v === 'bigint' ? v.toString() : v, 2) + '\n');
          async function read(name, query, variables) {
            const ast = parse(query);
            assert(ast.definitions.filter(d => d.kind === 'OperationDefinition').every(d => d.operation === 'query'));
            assert(!/\b(executeTransaction|simulateTransaction)\b/.test(query));
            save(name + '-request', {query, variables});
            const response = await fetch(EXPECTED.endpoint, {method: 'POST', headers: {'Content-Type': 'application/json', 'Cache-Control': 'no-store'}, body: JSON.stringify({query, variables}), signal: AbortSignal.timeout(45000)});
            assert.equal(response.status, 200);
            const result = await response.json();
            save(name, {capturedAt: new Date().toISOString(), response: result});
            assert(!result.errors?.length, JSON.stringify(result.errors));
            return result;
          }
          const proof = await read('season-three-proof', PROOF_QUERY, PROOF_VARIABLES);
          const inputs = await read('season-three-inputs', INPUTS_QUERY, INPUT_VARIABLES);
          const now = Date.now();
          const state = await inspectState(inputs, proof, {now, nowMs: now});
          save('season-three-state', state);
          console.log(JSON.stringify({readOnly: true, status: state.status, registry: contents(state.registry), ownedSeeds: state.ownedSeeds, submittedTransactions: 0}, (_, v) => typeof v === 'bigint' ? v.toString() : v, 2));
          JS
      - name: Preserve installed public packages for offline tests
        if: always()
        shell: bash
        run: |
          if test -d node_modules; then tar -czf season-four-results/dependencies.tar.gz node_modules; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: season-four-preparation
          path: season-four-results/
          retention-days: 7
          if-no-files-found: error
