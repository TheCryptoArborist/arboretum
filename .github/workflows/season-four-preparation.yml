name: Season 4 preparation
on:
  push:
    branches: [feature/season-four-owner-test-20261117]
    paths: ['.github/workflows/season-four-preparation.yml', 'settlement-cycle-four/**']
permissions:
  contents: read
concurrency:
  group: season-four-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Preserve exact tracked source
        run: |
          mkdir -p season-four-results
          git rev-parse HEAD > season-four-results/source-sha.txt
          git archive --format=tar HEAD | gzip > season-four-results/source.tar.gz
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate isolated candidate without changing old code
        run: python3 settlement-cycle-four/prepare.py
      - name: Verify actual Season 3 predecessor and current state
        run: node settlement-cycle-four/capture.mjs
      - name: Run candidate transaction and controller regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-isolation=none settlement-cycle-four/*.test.mjs | tee season-four-results/season-four-tests.txt
      - name: Verify retained Season 3 regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-isolation=none settlement-cycle-three/*.test.mjs | tee season-four-results/season-three-tests.txt
      - name: Build additive review candidate and check all 109 retained assets
        env:
          CONTEXT: branch-deploy
        shell: bash
        run: |
          set -euo pipefail
          node settlement-integration/build-review.mjs
          node settlement-cycle-four/build.mjs
          git diff --exit-code -- index.html wallet.js garden.js sui-sdk.bundle.js netlify netlify.toml package.json package-lock.json contract contract-payout settlement-cycle-three
          tar -czf season-four-results/review-dist.tar.gz dist
      - name: Preserve generated source and public evidence even on failure
        if: always()
        run: |
          tar -czf season-four-results/generated-source.tar.gz settlement-cycle-four
          if test -d node_modules; then tar -czf season-four-results/dependencies.tar.gz node_modules; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: season-four-preparation
          path: season-four-results/
          retention-days: 7
          if-no-files-found: error
