name: Season 4 preparation
on:
  push:
    branches: [feature/season-four-owner-test-20261117]
    paths: ['.github/workflows/season-four-preparation.yml', 'settlement-cycle-four/**']
permissions:
  contents: read
concurrency:
  group: season-four-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Preserve exact tracked source
        run: |
          mkdir -p season-four-results
          git rev-parse HEAD > season-four-results/source-sha.txt
          git archive --format=tar HEAD | gzip > season-four-results/source.tar.gz
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate isolated candidate without changing old code
        run: python3 settlement-cycle-four/prepare.py
      - name: Verify actual Season 3 predecessor and current state
        run: node settlement-cycle-four/capture.mjs
      - name: Rehearse the exact unsigned rollover without submitting
        run: node settlement-cycle-four/rehearse.mjs
      - name: Run candidate transaction and controller regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-isolation=none settlement-cycle-four/*.test.mjs | tee season-four-results/season-four-tests.txt
      - name: Verify retained Season 3 regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-isolation=none settlement-cycle-three/*.test.mjs | tee season-four-results/season-three-tests.txt
      - name: Run retained integration release checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          node settlement-integration/model.test.mjs
          node --test --test-isolation=none settlement-integration/reader.test.mjs settlement-integration/wallet.test.mjs settlement-integration/release/*.test.mjs
          node --test --test-isolation=none scripts/test-wallet-transactions.mjs
          python3 -m unittest discover -s settlement-integration/release -p 'test_*.py' -v
          python3 -m unittest discover -s settlement-integration/legacy-reconciliation -p 'test_*.py' -v
          for directory in settlement-admin settlement-setup settlement-season settlement-gameplay settlement-watering settlement-claim settlement-cycle; do
            node --test --test-isolation=none "$directory"/*.test.mjs
          done
          python3 -m unittest discover -s settlement-cycle -p 'test_*.py' -v
          python3 -m unittest discover -s settlement-cycle-three -p 'test_*.py' -v
          node --test --test-isolation=none scripts/test-tester-return.mjs scripts/build-policy.test.mjs settlement-integration/ui/panel.test.mjs
      - name: Build additive review candidate and check all 109 retained assets
        env:
          CONTEXT: branch-deploy
        shell: bash
        run: |
          set -euo pipefail
          node settlement-integration/build-review.mjs
          node settlement-cycle-four/build.mjs
          git diff --exit-code -- index.html wallet.js garden.js sui-sdk.bundle.js netlify netlify.toml package.json package-lock.json contract contract-payout settlement-cycle-three
          tar -czf season-four-results/review-dist.tar.gz dist
      - name: Check desktop and mobile with labelled recorded-data replay
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 settlement-cycle-four/browser-check.py
      - name: Check deployment credential availability without exposing it
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json,os,urllib.request
          token=os.environ.get('NETLIFY_AUTH_TOKEN','')
          result={'netlifyAuthConfigured':bool(token),'deploymentAttempted':False}
          if token:
              try:
                  request=urllib.request.Request('https://api.netlify.com/api/v1/sites/d425445d-4980-49be-8ab2-12e7527ba281',headers={'Authorization':'Bearer '+token})
                  with urllib.request.urlopen(request,timeout=30) as response: site=json.load(response)
                  result.update(netlifySiteVerified=site.get('id')=='d425445d-4980-49be-8ab2-12e7527ba281',publishedDeployId=(site.get('published_deploy') or {}).get('id'))
              except Exception:
                  result['netlifySiteVerified']=False
          with open('season-four-results/deployment-access.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps(result))
          PYCODE
      - name: Preserve generated source and public evidence even on failure
        if: always()
        run: |
          tar -czf season-four-results/generated-source.tar.gz settlement-cycle-four
          if test -d node_modules; then tar -czf season-four-results/dependencies.tar.gz node_modules; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: season-four-preparation
          path: season-four-results/
          retention-days: 7
          if-no-files-found: error
