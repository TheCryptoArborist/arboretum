name: Season 1 holder bonuses
on:
  push:
    branches: [feature/season1-holder-bonuses]
    paths: ['scripts/*season1-holder*', 'contract/season1-holder/**', '.github/workflows/season1-holder-bonuses.yml']
  pull_request:
    paths: ['scripts/*season1-holder*', 'contract/season1-holder/**', '.github/workflows/season1-holder-bonuses.yml']
permissions:
  contents: read
concurrency:
  group: season1-holder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read canonical NFTree public metadata and immutable module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import json,datetime,hashlib
          out=Path('step3-results/evidence');out.mkdir(parents=True,exist_ok=True)
          package='0xf6c6d439ea0da2f3e9ba79e4992a7a4c113215fbf54c442ac9020c315f953705'
          endpoint='https://graphql.mainnet.sui.io/graphql'
          def gql(q,v=None):
              r=Request(endpoint,data=json.dumps({'query':q,'variables':v or {}}).encode(),headers={'Content-Type':'application/json','User-Agent':'Arboretum-holder-readonly'})
              with urlopen(r,timeout=30) as f:obj=json.load(f)
              if obj.get('errors'):raise RuntimeError(json.dumps(obj['errors']))
              return obj['data']
          report={'read_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'endpoint':endpoint,'package':package,'scope':'Read-only collection module and up to 50 NFT objects, no wallet transaction.','errors':[]}
          for name,q,v in [
              ('collection-module','query($a:SuiAddress!){object(address:$a){address asMovePackage{module(name:"collection"){name disassembly}}}}',{'a':package}),
              ('canonical-nfts','query($t:String!){objects(first:50,filter:{type:$t}){pageInfo{hasNextPage endCursor} nodes{address version asMoveObject{contents{type{repr} json}}}}}',{'t':package+'::collection::NFT'})]:
              try:
                  obj=gql(q,v);text=json.dumps(obj,indent=2);(out/(name+'.json')).write_text(text)
                  report[name+'_sha256']=hashlib.sha256(text.encode()).hexdigest()
              except Exception as e:report['errors'].append({'query':name,'error':str(e)})
          (out/'coverage.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Cached pinned compiler
        if: hashFiles('scripts/check-season1-holder.py') != ''
        id: sui-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/sui-step1
          key: sui-mainnet-v1.79.1-547b3091-ubuntu24
      - name: Install verified compiler
        if: hashFiles('scripts/check-season1-holder.py') != '' && steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p "$HOME/.local/sui-step1"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sui.tgz" 'https://github.com/MystenLabs/sui/releases/download/mainnet-v1.79.1/sui-mainnet-v1.79.1-ubuntu-x86_64.tgz'
          echo '547b3091e975b8a6b4078473a3868d86e985156b6715a8c4afb7fd7313a36abf  '"$RUNNER_TEMP/sui.tgz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile,os,pathlib,shutil
          with tarfile.open(os.environ['RUNNER_TEMP']+'/sui.tgz') as t:
              m=[x for x in t.getmembers() if x.isfile() and pathlib.PurePosixPath(x.name).name=='sui'];assert len(m)==1
              p=pathlib.Path.home()/'.local/sui-step1/sui'
              with p.open('wb') as f:shutil.copyfileobj(t.extractfile(m[0]),f)
              p.chmod(0o755)
          PY
          rm "$RUNNER_TEMP/sui.tgz"
      - name: Empty keystore and local-only execution configuration
        if: hashFiles('scripts/check-season1-holder.py') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path.home()/'.sui/sui_config';p.mkdir(parents=True,exist_ok=True)
          k=p/'empty.keystore';k.write_text('[]');k.chmod(0o600)
          (p/'client.yaml').write_text(json.dumps({'keystore':{'File':str(k)},'external_keys':None,'envs':[{'alias':'offline-tests','rpc':'http://127.0.0.1:9','ws':None,'basic_auth':None,'chain_id':'00000000'}],'active_env':'offline-tests','active_address':None}))
          PY
      - name: Test holder grants and retained isolation controls
        if: hashFiles('scripts/check-season1-holder.py') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/sui-step1:$PATH"
          sui --version | tee step3-results/compiler.txt
          python3 scripts/check-season1-holder.py
          git diff --exit-code -- contract/sources/arboretum.move wallet.js garden.js index.html netlify.toml
      - name: Preserve source and evidence only
        if: always()
        run: |
          mkdir -p step3-results/reproduction/scripts step3-results/reproduction/contract
          cp scripts/*season1*.py step3-results/reproduction/scripts/
          cp -r contract/sources step3-results/reproduction/contract/
          for dir in season1-step1 season1-isolation season1-holder; do
            mkdir -p "step3-results/reproduction/contract/$dir"
            find "contract/$dir" -maxdepth 1 -type f -exec cp '{}' "step3-results/reproduction/contract/$dir/" \; 2>/dev/null || true
          done
          cp .github/workflows/season1-holder-bonuses.yml step3-results/reproduction/workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arboretum-season1-holder
          path: step3-results/
          retention-days: 14
