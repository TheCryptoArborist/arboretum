name: Read BOOM receipts via GraphQL
on:
  push:
    branches: [analysis/boom-receipts-20260912]
    paths: [.github/workflows/boom-graphql-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public transaction effects and configured contract objects
        run: |
          python3 -u - <<'PY'
          import json,time,datetime,concurrent.futures
          from pathlib import Path
          from urllib.request import Request,urlopen
          OUT=Path('boom-graphql');OUT.mkdir()
          ADDR='0x18d72fc2a3df6d92d0806da3b04d92be056e2d6d35882a56c16ddb25f48d35d6'
          report={'wallet':ADDR,'started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'errors':[]}
          ENDPOINTS=['https://graphql.mainnet.sui.io/graphql','https://sui-mainnet.mystenlabs.com/graphql']
          def request(url,payload):
              req=Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','User-Agent':'BOOM-read-only-analysis'})
              with urlopen(req,timeout=30) as r:return json.load(r)
          def save(name,obj):(OUT/name).write_text(json.dumps(obj,indent=2))
          endpoint=None
          for u in ENDPOINTS:
              try:
                  r=request(u,{'query':'{ chainIdentifier }'});save('endpoint-probe-'+str(ENDPOINTS.index(u))+'.json',r)
                  if 'data' in r and not r.get('errors'):endpoint=u;break
              except Exception as e:report['errors'].append({'endpoint':u,'error':str(e)})
          if not endpoint:
              save('coverage.json',report);raise SystemExit('No public GraphQL endpoint answered.')
          report['endpoint']=endpoint;print('Using',endpoint)
          def gql(query,variables=None):
              for retry in range(2):
                  try:
                      r=request(endpoint,{'query':query,'variables':variables or {}})
                      if r.get('errors'):raise RuntimeError(json.dumps(r['errors']))
                      return r['data']
                  except Exception:
                      if retry:raise
                      time.sleep(1)
          fields='''digest sender { address } transactionBcs effects {
              status timestamp checkpoint { sequenceNumber } effectsJson
              balanceChanges(first:30) { pageInfo { hasNextPage endCursor } nodes { amount coinType { repr } owner { address asObject { address } } } }
              events(first:30) { pageInfo { hasNextPage endCursor } nodes { sequenceNumber transactionModule { name package { address } } contents { type { repr } json } } }
              objectChanges(first:30) { pageInfo { hasNextPage endCursor } nodes { address idCreated idDeleted inputState { version asMoveObject { contents { type { repr } } } } outputState { version digest asMoveObject { contents { type { repr } } } } } }
          }'''
          query='query($a:SuiAddress!,$c:String){ transactions(last:50,before:$c,filter:{sentAddress:$a}) { pageInfo { startCursor hasPreviousPage } nodes { '+fields+' } } }'
          cursor=None;rows=[];more=True
          try:
              for page in range(24):
                  r=gql(query,{'a':ADDR,'c':cursor});save('wallet-page-%02d.json'%(page+1),r)
                  t=r['transactions'];rows.extend(t['nodes']);cursor=t['pageInfo']['startCursor'];more=t['pageInfo']['hasPreviousPage']
                  print('Page',page+1,'total',len(rows),'has_more',more)
                  if not more:break
                  time.sleep(.25)
          except Exception as e:report['errors'].append({'transactions':str(e)})
          report.update({'transaction_count':len(rows),'has_more':more,'next_cursor':cursor})
          save('transactions.json',rows)
          objects={
            'lootbox-config':'0x843198e25751c9f196d1612b77c8164535eed9f0e0500397042edf09a5453632',
            'treasury':'0xd27e48a5973c33e70504393e97fe1a935780c8f780dfb8dcd1b12f7a0a8a6946',
            'autopay':'0x5077e43c411dec5ef5464ae9b337c2644d0300140b9caecad860a14fd7a22711',
            'dev':'0xa113c79db53d1b8a040d7091381e633f8598daa480026968ab8f8b07cd3fa69a',
            'pool':'0x05d34e318fd9501a70ef16c0db6cae4e0f392f6b87f24573f42830c07448c3eb'}
          for name,address in objects.items():
              try:save(name+'-object.json',gql('query($a:SuiAddress!){ object(address:$a){ address version digest previousTransaction { digest } asMoveObject { contents { type { repr } json } } } }',{'a':address}))
              except Exception as e:report['errors'].append({name:str(e)})
          # Public follow-on flows for the recipients. Samples, not all-time revenue.
          for name in ['autopay','treasury','dev','pool']:
              try:save(name+'-recent-outgoing.json',gql(query,{'a':objects[name],'c':None}))
              except Exception as e:report['errors'].append({name+'-history':str(e)})
          report['finished_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat();save('coverage.json',report);print(json.dumps(report,indent=2))
          PY
      - name: Preserve public chain data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boom-graphql-receipts
          path: boom-graphql/
          retention-days: 3
