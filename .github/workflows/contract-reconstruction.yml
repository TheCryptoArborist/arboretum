name: Deployed contract reconstruction
on:
  push:
    branches: [feature/deployed-contract-reconstruction-20261019]
    paths: ['contract-reconstruction/**', 'contract/sources/arboretum.move', 'gameplay-verification/deployed-probe/**', 'gameplay-verification/contract-tests/payout-characterization.move.inc', '.github/workflows/contract-reconstruction.yml']
  pull_request:
    paths: ['contract-reconstruction/**', 'contract/sources/arboretum.move', 'gameplay-verification/deployed-probe/**', 'gameplay-verification/contract-tests/payout-characterization.move.inc', '.github/workflows/contract-reconstruction.yml']
permissions:
  contents: read
concurrency:
  group: contract-reconstruction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact public compiler and framework inputs
        run: python3 contract-reconstruction/prepare_toolchain.py --work-dir "$RUNNER_TEMP/arboretum-v11-tools"
      - name: Compile the deployment baseline and characterize existing behavior
        run: |
          python3 contract-reconstruction/build_reconstruction.py \
            --compiler "$RUNNER_TEMP/arboretum-v11-tools/sui" \
            --compiler-archive "$RUNNER_TEMP/arboretum-v11-tools/sui-mainnet-v1.78.1-ubuntu-x86_64.tgz" \
            --framework-dir "$RUNNER_TEMP/arboretum-v11-tools/framework-8b9163554164776bc3372d828f8d6ced55aa2b5e" \
            --framework-archive "$RUNNER_TEMP/arboretum-v11-tools/framework-8b9163554164776bc3372d828f8d6ced55aa2b5e.tar.gz" \
            --work-dir "$RUNNER_TEMP/arboretum-v11-build" \
            --run-characterization-tests
      - name: Require byte-for-byte identity with the actual upgrade
        run: |
          python3 contract-reconstruction/compare_bytecode.py \
            --candidate "$RUNNER_TEMP/arboretum-v11-build/generated/build/arboretum/bytecode_modules/arboretum.mv" \
            --target prepublication --require-exact \
            --output contract-reconstruction/evidence/bytecode-comparison.json
      - name: Verify detection of altered bytecode and evidence
        run: python3 -m unittest discover -s contract-reconstruction/comparator-tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployed-contract-reconstruction
          path: contract-reconstruction/evidence/
          retention-days: 30
